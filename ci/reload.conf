# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The probe fetches a page on every reload: a reload that detached the body
# filter would keep answering on the port but stop rewriting the response,
# so the probe prints the substituted word only while the filter is still in
# the chain.

mkdir -p "$WORK/root"
printf 'reload-me\n' > "$WORK/root/probe.html"

RELOAD_HTTP="
    default_type text/html;"

RELOAD_SERVER="
        location / {
            root $WORK/root;
            subs_filter reload-me RELOADED;
        }"

RELOAD_EXPECT='RELOADED'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe.html" | tr -d '\n'
}
